[project]
name = "draftly"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.112.0",
    "google-genai>=1.28.0",
    "google-cloud-documentai>=3.15.0",
    "google-cloud-speech>=2.40.0",
    "google-cloud-storage>=3.12.1",
    "markdownify>=1.2.3",
    "onnxruntime>=1.27.0",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "streamlit>=1.47.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.51.0",
    "cloudscraper",
    "lxml>=6.1.1",
    # Declared explicitly for the OCR benchmark. These already arrived transitively
    # via docling, but the benchmark's preprocessing and rendering are built
    # directly on them, and relying on another package's dependency tree for that
    # is a latent break.
    "pypdfium2>=4.30.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Runs C, E and F need a box-producing engine. Surya is kept optional because it
# pulls torch (large, and GPU-oriented) and because it is GPL-3.0 licensed, which
# needs a ruling before it can influence a product decision - the platform already
# rejected PyMuPDF on AGPL grounds. rapidocr (Apache-2.0) is the default detector
# and is already installed.
surya = ["surya-ocr>=0.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draftly"]

[tool.uv.sources]
cloudscraper = { git = "https://github.com/VeNoMouS/cloudscraper.git" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "seaborn>=0.13.2",
]
