[project]
name = "draftly"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.112.0",
    "google-genai>=1.28.0",
    "google-cloud-documentai>=3.15.0",
    "google-cloud-speech>=2.40.0",
    "google-cloud-storage>=3.12.1",
    "markdownify>=1.2.3",
    "onnxruntime>=1.27.0",
    "openai>=2.54.0",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "streamlit>=1.47.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.51.0",
    "cloudscraper",
    "lxml>=6.1.1",
    "pypdfium2>=4.30.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "pyvis>=0.3.2",
    "camoufox>=0.5.4",
    "pdfplumber>=0.11.9",
]

[project.optional-dependencies]
surya = ["surya-ocr>=0.6.0"]

doctr = ["python-doctr>=1.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draftly"]

[tool.uv.sources]
cloudscraper = { git = "https://github.com/VeNoMouS/cloudscraper.git" }

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "seaborn>=0.13.2",
]
