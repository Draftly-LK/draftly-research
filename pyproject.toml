[project]
name = "draftly"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.112.0",
    "google-genai>=1.28.0",
    "google-cloud-documentai>=3.15.0",
    "google-cloud-speech>=2.40.0",
    "google-cloud-storage>=3.12.1",
    "markdownify>=1.2.3",
    "onnxruntime>=1.27.0",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "streamlit>=1.47.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/draftly"]
